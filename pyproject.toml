[project]
name = "forja-review"
version = "0.1.0"
description = "GitHub App que revisa pull requests em português usando o modelo servido pelo forja-serve"
requires-python = ">=3.12"
dependencies = [
    "forja-contracts",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.8",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "typer>=0.12",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27"]

[project.scripts]
forja-review = "forja_review.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forja_review"]

# Local. Ao publicar o hub no GitHub, troque por:
# forja-contracts = { git = "https://github.com/<usuario>/forja", subdirectory = "contracts" }
[tool.uv.sources]
forja-contracts = { path = "../forja/contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
