name: ci
# Manual trigger for now; restore `on: [push, pull_request]` to run on every push.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: forja-review}
      - uses: actions/checkout@v4
        with: {repository: "${{ github.repository_owner }}/forja", path: forja}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
        working-directory: forja-review
      - run: uv run ruff check . && uv run ruff format --check .
        working-directory: forja-review
      - run: uv run pytest -q
        working-directory: forja-review
